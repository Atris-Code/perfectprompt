version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nexo_db_prod
    restart: always
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - nexo_network_prod

  backend:
    build: ./backend
    container_name: nexo_backend_prod
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    # FIX (seguridad): no exponer el puerto 8000 al público; solo nginx lo alcanza.
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://188.166.19.103,http://localhost:3000}
      # Fase 5: credenciales semilla — CAMBIAR en producción
      - DEMO_EMAIL=${DEMO_EMAIL:-cientifico@nexo.com}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-ciencia123}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@nexo.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    depends_on:
      - db
    networks:
      - nexo_network_prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_NEXO_BACKEND_URL=http://188.166.19.103
    container_name: nexo_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - nexo_network_prod

volumes:
  postgres_data_prod:

networks:
  nexo_network_prod:
    driver: bridge
